# Cloudflare Pages configuration — Lean MVP deployment (Phase 7).
# Build command and output directory for Astro's static output.
name = "alan-apire-site"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Environment variables (set in Cloudflare dashboard for production):
# FORMSPREE_ENDPOINT  → form action target
# PLAUSIBLE_DOMAIN / GA4_MEASUREMENT_ID → analytics
# ASTRO_SITE          → canonical production URL
