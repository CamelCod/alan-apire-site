# Cloudflare Pages — static Astro output (no Workers adapter).
# Dashboard: Pages → Create → connect GitHub, or deploy with:
#   npx wrangler pages deploy dist --project-name=alan-apire-site
name = "alan-apire-site"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

# Set these as Cloudflare Pages *build* environment variables (not runtime):
#   ASTRO_SITE            https://alanapire.ae
#   FORMSPREE_ENDPOINT    https://formspree.io/f/<id>
#   ANALYTICS_PROVIDER    plausible | ga4 | none
#   PLAUSIBLE_DOMAIN      alanapire.ae
#   GA4_MEASUREMENT_ID    G-XXXXXXXX
